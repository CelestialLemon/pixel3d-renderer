<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pixel3D — Pass 3 · Golden Hour</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 8 8%27%3E%3Crect width=%278%27 height=%278%27 fill=%27%23c8643c%27/%3E%3Crect x=%272%27 y=%272%27 width=%274%27 height=%274%27 fill=%27%23f3d9a0%27/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/src/app/viewer/style.css" />
</head>
<body>
<main id="stage" aria-label="Pixel diorama">
  <canvas id="p3-view" aria-label="Pass 3 interactive scene"></canvas>
  <canvas id="p1-view" aria-label="Pass 1 for comparison"></canvas>
  <canvas id="pal-view" aria-label="Other palette for comparison"></canvas>
</main>
<div id="loading">baking pixels…</div>
<header id="title"><span class="eyebrow">PIXEL3D RENDERER · PASS 3</span><b id="title-name">Cookie Co.</b><span id="clock-title">Golden hour</span></header>
<button id="divider" class="divider" role="slider" aria-label="Comparison boundary" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span>↔</span></button>
<div id="tags"><span id="tag1">Pass 1</span><span id="tag3">Pass 3</span></div>
<aside id="panel">
  <label>Scene <select id="scene" aria-label="Scene"></select></label>
  <div class="panel-heading">Time of day <output id="clock">17:30</output></div>
  <input type="range" id="hour" min="0" max="24" step="0.05" value="17.5" aria-label="Time of day" />
  <div class="preset-row" id="presets"></div>
  <label><input type="checkbox" id="cycle" /> Run the day</label>
  <hr />
  <label><input type="checkbox" id="animate" /> Living world</label>
  <label><input type="checkbox" id="outlines" /> Selective outlines</label>
  <label><input type="checkbox" id="dither" /> Subtle dithering</label>
  <label><input type="checkbox" id="cleanup" /> Pixel clean-up</label>
  <label><input type="checkbox" id="contacts" /> Contact shadows</label>
  <label><input type="checkbox" id="clouds" /> Passing clouds</label>
  <label><input type="checkbox" id="glow" /> Lamp light</label>
  <label><input type="checkbox" id="vignette" /> Corner shading</label>
  <label><input type="checkbox" id="auto" /> Auto-orbit</label>
  <label>Pixel size <select id="pixel" aria-label="Pixel size"><option>2</option><option selected>3</option><option>4</option><option>6</option></select></label>
  <hr />
  <label><input type="checkbox" id="compare" /> Compare with Pass 1</label>
  <label><input type="checkbox" id="compare-palette" /> Compare palettes</label>
  <div class="row" id="palette-sizes" hidden><label>Left <select id="k-left" aria-label="Left palette size"><option>40</option><option>48</option><option>56</option><option>64</option><option>72</option><option>80</option><option>96</option></select></label><label>Right <select id="k-right" aria-label="Right palette size"><option>40</option><option>48</option><option>56</option><option>64</option><option>72</option><option>80</option><option>96</option></select></label></div>
  <div class="preset-row" id="view-presets"></div>
  <div class="row"><button id="rotL" aria-label="Rotate left">↶</button><button id="rotR" aria-label="Rotate right">↷</button><button id="shot">Save PNG</button></div>
  <div id="stats"></div>
</aside>
<footer id="hint">Drag to orbit · Scroll to zoom · Shift + drag to pan · H hides controls · <a href="/">Compare all passes →</a></footer>
<script type="module" src="/src/app/viewer/main.ts"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Cookie Co. — Pass 0</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 8 8%27%3E%3Crect width=%278%27 height=%278%27 fill=%27%23c8643c%27/%3E%3Crect x=%272%27 y=%272%27 width=%274%27 height=%274%27 fill=%27%23f3d9a0%27/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/src/reference/pass0/style.css" />
</head>
<body>
<canvas id="view"></canvas>
<div id="loading">baking pixels…</div>
<header id="title"><b>COOKIE CO.</b><span>Pass 0 · original renderer</span></header>
<aside id="panel">
  <label>Pixel size
    <select id="pixel"><option>2</option><option selected>3</option><option>4</option><option>6</option></select>
  </label>
  <label><input type="checkbox" id="outlines" checked /> Smart outlines</label>
  <label><input type="checkbox" id="dither" checked /> Ordered dither</label>
  <label><input type="checkbox" id="cleanup" checked /> Pixel clean-up</label>
  <label><input type="checkbox" id="clouds" checked /> Cloud shadows</label>
  <label><input type="checkbox" id="auto" checked /> Auto-orbit</label>
  <label>Sun <input type="range" id="sun" min="-180" max="180" value="-62" /></label>
  <div class="row"><button id="rotL" title="Rotate 45° left">⟲</button><button id="rotR" title="Rotate 45° right">⟳</button><button id="shot">PNG</button></div>
  <div id="stats"></div>
</aside>
<footer id="hint">drag · orbit &nbsp;|&nbsp; wheel · zoom &nbsp;|&nbsp; shift/right-drag · pan</footer>
<script type="module" src="/src/reference/pass0/main.ts"></script>
</body>
</html>
